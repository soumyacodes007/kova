# Drawing worker environment: turns a reference STEP into a dimensioned
# multi-view drawing with draftwright (AGPL; validator-side only, never shipped
# to customers). draftwright pins build123d 0.11.x on Python 3.13, so this env
# is separate from the CAD worker (build123d 0.13); the two exchange STEP files.
[project]
name = "cadrecover-drawing-worker"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "cadrecover",
    "draftwright==0.4.35",
    "pillow>=10",
    "pymupdf>=1.24",  # SVG -> PNG rasterizing (AGPL, like draftwright; validator-side only)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
cadrecover = { path = "../..", editable = true }
