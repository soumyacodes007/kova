[project]
name = "cadrecover"
version = "0.1.0"
description = "Bittensor subnet: engineering drawings to editable, verified parametric CAD"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Core deps are only what every environment needs (protocol schemas). The
# services env adds the `services` extra; the CAD and drawing workers are
# separate locked projects under images/ that depend on this package.
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
services = [
    "bittensor==11.3.0; sys_platform != 'win32'",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "huggingface-hub>=0.27,<2",
    "rich>=13",
]

[project.scripts]
cadrecover = "cadrecover.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
